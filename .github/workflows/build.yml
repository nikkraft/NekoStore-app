name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать project.zip
        run: unzip -q project.zip -d proj

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Подпись: keystore из секрета KEYSTORE_BASE64 или файл nekostore.jks в корне репо.
      # Нет ни того ни другого — соберётся debug.
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # убираем пробелы, переводы строк и кавычки, которые мог добавить телефон при вставке
            if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n"' | base64 -d > "$RUNNER_TEMP/nekostore.jks"; then
              echo "::error::Секрет KEYSTORE_BASE64 повреждён (обрезан или с лишними символами). Вставьте его заново целиком одной строкой."
              exit 1
            fi
            echo "KEYSTORE_FILE=$RUNNER_TEMP/nekostore.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          elif [ -f nekostore.jks ]; then
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/nekostore.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi

      - name: Build
        working-directory: proj
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$SIGNED" = "1" ]; then
            gradle assembleRelease --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: NekoStore
          path: proj/app/build/outputs/apk/*/*.apk
