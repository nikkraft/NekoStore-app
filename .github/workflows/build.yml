name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать project.zip
        run: unzip -q project.zip -d proj

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Если в Secrets есть keystore — соберём подписанный release, иначе debug
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nekostore.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/nekostore.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi

      - name: Build
        working-directory: proj
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$SIGNED" = "1" ]; then
            gradle assembleRelease --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: NekoStore
          path: proj/app/build/outputs/apk/*/*.apk 
